name: Build (Compose Desktop)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libpulse0

      - name: Run tests
        run: ./gradlew test

      # jpackage 打包必须在目标操作系统上进行(Compose 官方限制)
      # macOS：发布产物为 dmg
      - name: Build macOS app for signing
        if: runner.os == 'macOS'
        run: ./gradlew createDistributable

      - name: Sign macOS app when certificate is configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "未配置 Apple 证书，跳过签名"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/apple-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/apple-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "temporary-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temporary-password" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "temporary-password" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          /usr/bin/codesign --deep --force --options runtime --timestamp             --sign "$APPLE_SIGNING_IDENTITY"             build/compose/binaries/main/app/MusicUnlock.app

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: ./gradlew packageDmg

      - name: Notarize and staple macOS dmg
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "未配置 Apple 公证凭据，跳过公证"
            exit 0
          fi
          DMG=$(find build/compose/binaries/main/dmg -name '*.dmg' | head -n 1)
          xcrun notarytool submit "$DMG"             --apple-id "$APPLE_ID"             --team-id "$APPLE_TEAM_ID"             --password "$APPLE_APP_PASSWORD"             --wait
          xcrun stapler staple "$DMG"

      # Windows：发布产物为单文件 exe。
      # createDistributable 生成 exe + 自带 JRE 的应用目录，再用 7-Zip SFX
      # (sfx + config + .7z 拼接) 封装为单文件，双击自动解压到临时目录运行，退出后清理。
      - name: Package (Windows single exe)
        if: runner.os == 'Windows'
        run: |
          ./gradlew createDistributable || { echo "=== jpackage ERR logs ==="; cat build/compose/logs/createDistributable/*err.txt 2>/dev/null; echo "=== jpackage OUT logs ==="; cat build/compose/logs/createDistributable/*out.txt 2>/dev/null; exit 1; }
          VERSION=$(grep -m1 '^version' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')
          SEVENZIP=$(cygpath -u "$PROGRAMFILES/7-Zip/7z.exe")
          if [ ! -f "$SEVENZIP" ]; then
            powershell -Command "choco install 7zip.install -y --no-progress"
            SEVENZIP=$(cygpath -u "$PROGRAMFILES/7-Zip/7z.exe")
          fi
          cd build/compose/binaries/main/app/MusicUnlock
          "$SEVENZIP" a -t7z -mx=7 -y "$OLDPWD/build/MusicUnlock.7z" "*"
          cd "$OLDPWD"
          cat packaging/windows/7zsd_All_x64.sfx packaging/windows/sfx-config.txt build/MusicUnlock.7z > "MusicUnlock-$VERSION-windows.exe"
          ls -la "MusicUnlock-$VERSION-windows.exe"
          file "MusicUnlock-$VERSION-windows.exe" || true


      - name: Sign Windows executable when certificate is configured
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ]; then
            echo "未配置 Windows 证书，跳过签名"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/windows-signing.pfx"
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          VERSION=$(grep -m1 '^version' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')
          SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe | sort | tail -n 1)
          "$SIGNTOOL" sign /fd SHA256 /f "$(cygpath -w "$CERT_PATH")" /p "$WINDOWS_CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "MusicUnlock-$VERSION-windows.exe"

      - name: Package (Linux deb and rpm)
        if: runner.os == 'Linux'
        run: ./gradlew packageDeb packageRpm

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MusicUnlock-macos
          if-no-files-found: error
          path: build/compose/binaries/main/dmg/*.dmg

      - name: Upload Windows exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MusicUnlock-windows
          if-no-files-found: error
          path: MusicUnlock-*-windows.exe

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: MusicUnlock-linux
          if-no-files-found: error
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm

  # 打 v* 标签时自动发布：把构建产物直接上传为 GitHub Release（无需本地中转）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p assets
          cp dist/MusicUnlock-macos/*.dmg assets/
          cp dist/MusicUnlock-windows/*.exe assets/
          cp dist/MusicUnlock-linux/deb/*.deb assets/
          cp dist/MusicUnlock-linux/rpm/*.rpm assets/
          VERSION="$GITHUB_REF_NAME"
          (cd assets && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum) > assets/SHA256SUMS.txt
          gh release create -R "$GITHUB_REPOSITORY" "$VERSION" assets/* \
            --title "MusicUnlock $VERSION" \
            --notes "**MusicUnlock $VERSION**

            - **Windows**：单文件 \`MusicUnlock-$VERSION-windows.exe\`，内嵌 JRE，无外部资源文件，双击直接运行（首次启动自动解压到临时目录，退出后自动清理）
            - **macOS**：\`MusicUnlock-$VERSION.dmg\` 磁盘映像，拖入「应用程序」即可
            - **Linux**：\`deb\` 与 \`rpm\` 安装包
            - **校验**：\`SHA256SUMS.txt\`
            - **签名**：CI 在配置证书时自动签名；macOS 在配置公证凭据时同时完成公证与装订"
