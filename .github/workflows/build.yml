name: Build (Compose Desktop)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run tests
        run: ./gradlew test

      # jpackage 打包必须在目标操作系统上进行(Compose 官方限制)
      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: ./gradlew packageDmg

      # Windows 安装器(jpackage --type exe 依赖 WiX)在 CI 上不稳定,
      # 改用 createDistributable 生成 exe + 自带 JRE 的目录, 再打成 zip
      - name: Package (Windows .exe zip)
        if: runner.os == 'Windows'
        run: |
          ./gradlew createDistributable
          tar -a -c -f MusicUnlock-windows.zip -C build/compose/binaries/main/app .
          ls -la MusicUnlock-windows.zip

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - name: Package (Linux .deb/.rpm)
        if: runner.os == 'Linux'
        run: ./gradlew packageDeb packageRpm

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MusicUnlock-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/compose/binaries/main/dmg/*.dmg
            MusicUnlock-windows.zip
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
